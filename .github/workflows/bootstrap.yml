name: Bootstrap warp-zh

on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap.yml']
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download PR patch
        run: |
          mkdir -p patches
          curl -fsSL https://github.com/warpdotdev/warp/pull/11960.patch \
            -o patches/0001-zh-CN-core-ui.patch || \
          echo "# patch unavailable, run: warp-zh apply <warp-dir>" \
            > patches/0001-zh-CN-core-ui.patch
          echo "1 patch" > patches/series

      - name: Generate project files
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const mk = (p) => fs.mkdirSync(path.dirname(p), {recursive:true});

            const files = {
              'pyproject.toml': `[project]
name = "warp-zh"
version = "0.1.0"
description = "Warp 终端简体中文汉化工具链"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["warp", "terminal", "i18n", "localization", "chinese"]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
warp-zh = "warp_zh.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
`,
