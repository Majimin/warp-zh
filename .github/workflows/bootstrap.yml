              'warp_zh/extractor.py': `"""Rust 源码字符串提取器（基于正则 AST 近似）。"""
from __future__ import annotations
import re
from pathlib import Path
from typing import Iterator
from .models import StringEntry, SourceLocation
from .config import WarpZhConfig

# 匹配常见调用点的字符串参数
_CALL_PATTERNS = [
    (r'ActionButton::new\\s*\\(\\s*"([^"\\\\]*(?:\\\\.[^"\\\\]*)*)"', "ActionButton::new"),
    (r'CompactibleActionButton::new\\s*\\(\\s*"([^"\\\\]*(?:\\\\.[^"\\\\]*)*)"', "CompactibleActionButton::new"),
    (r'\\.with_tooltip\\s*\\(\\s*"([^"\\\\]*(?:\\\\.[^"\\\\]*)*)"', ".with_tooltip"),
    (r'\\.with_title\\s*\\(\\s*"([^"\\\\]*(?:\\\\.[^"\\\\]*)*)"', ".with_title"),
    (r'\\.with_label\\s*\\(\\s*"([^"\\\\]*(?:\\\\.[^"\\\\]*)*)"', ".with_label"),
    (r'\\.with_placeholder\\s*\\(\\s*"([^"\\\\]*(?:\\\\.[^"\\\\]*)*)"', ".with_placeholder"),
    (r'\\.with_header\\s*\\(\\s*"([^"\\\\]*(?:\\\\.[^"\\\\]*)*)"', ".with_header"),
    (r'\\.with_description\\s*\\(\\s*"([^"\\\\]*(?:\\\\.[^"\\\\]*)*)"', ".with_description"),
    (r'\\.text\\s*\\(\\s*"([^"\\\\]*(?:\\\\.[^"\\\\]*)*)"', ".text"),
    (r'tooltip!\\s*\\(\\s*"([^"\\\\]*(?:\\\\.[^"\\\\]*)*)"', "tooltip!"),
    (r'label!\\s*\\(\\s*"([^"\\\\]*(?:\\\\.[^"\\\\]*)*)"', "label!"),
    (r'\\.to_string\\(\\)', None),  # 后缀标记 — 不单独提取
]

_EXTRACT_RE = re.compile(
    r'(?:'
    r'ActionButton::new|CompactibleActionButton::new'
    r'|\\.with_(?:tooltip|title|label|placeholder|header|description)'
    r'|\\.text'
    r'|tooltip!|label!'
    r')\\s*\\(\\s*"([^"\\\\\\n]*(?:\\\\.[^"\\\\\\n]*)*)"',
    re.MULTILINE,
)


def _derive_context(file: Path, warp_root: Path) -> str:
    rel = file.relative_to(warp_root)
    parts = rel.with_suffix("").parts
    return ".".join(parts).replace("/", ".")


def extract_from_file(
    file: Path,
    warp_root: Path,
    cfg: WarpZhConfig,
) -> Iterator[StringEntry]:
    try:
        raw = file.read_bytes()
        text = raw.decode("utf-8", errors="replace")
    except OSError:
        return

    context = _derive_context(file, warp_root)
    lines = text.splitlines(keepends=True)
    # 构建行→字节偏移映射
    offsets: list[int] = []
    pos = 0
    for line in lines:
        offsets.append(pos)
        pos += len(line.encode("utf-8"))

    for m in _EXTRACT_RE.finditer(text):
        source = m.group(1)
        if not source or len(source) < 2:
            continue
        # 跳过无需翻译的字符串
        skip = False
        for pat in cfg.skip_patterns:
            if pat in source:
                skip = True
                break
        if skip:
            continue
        # 非 ASCII 字符说明已翻译
        if not source.isascii():
            continue

        # 计算行列
        start_byte = len(text[:m.start(1)].encode("utf-8"))
        end_byte = start_byte + len(source.encode("utf-8"))
