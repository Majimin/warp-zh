}


class Glossary:
    def __init__(self, extra: Optional[dict[str, str]] = None):
        self._terms: dict[str, str] = {**BUILTIN_GLOSSARY}
        if extra:
            self._terms.update(extra)

    @classmethod
    def load(cls, path: Path, overrides_path: Optional[Path] = None) -> "Glossary":
        extra: dict[str, str] = {}
        for p in [path, overrides_path]:
            if p and p.exists():
                try:
                    from ruamel.yaml import YAML
                    yaml = YAML()
                    data = yaml.load(p)
                    if isinstance(data, dict):
                        extra.update(data)
                except Exception:
                    pass
        return cls(extra)

    def lookup(self, text: str) -> Optional[str]:
        if text in self._terms:
            return self._terms[text]
        lower = text.lower()
        for k, v in self._terms.items():
            if k.lower() == lower:
                return v
        return None

    @property
    def terms(self) -> dict[str, str]:
        return dict(self._terms)
