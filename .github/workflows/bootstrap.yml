              'warp_zh/models.py': `"""核心数据模型：贯穿提取→翻译→改写→打补丁全流程。"""
from __future__ import annotations
import hashlib
from dataclasses import dataclass, field
from enum import Enum
from pathlib import Path
from typing import Optional


class TranslationStatus(str, Enum):
    UNTRANSLATED = "untranslated"
    MACHINE      = "machine"
    REVIEWED     = "reviewed"
    STALE        = "stale"


@dataclass(frozen=True, slots=True)
class StringId:
    value: str

    @classmethod
    def derive(cls, source_text: str, context: str) -> "StringId":
        digest = hashlib.sha1(
            f"{context}\\x00{source_text}".encode()
        ).hexdigest()
        return cls(value=digest[:12])

    def __str__(self) -> str:
        return self.value


@dataclass(frozen=True, slots=True)
class SourceLocation:
    file: Path
    line: int
    column: int
    byte_start: int
    byte_end: int

    def __post_init__(self) -> None:
        if self.byte_end < self.byte_start:
            raise ValueError(
                f"非法字节区间 [{self.byte_start},{self.byte_end}) "
                f"@ {self.file}:{self.line}"
            )


@dataclass(frozen=True, slots=True)
class StringEntry:
    source_text: str
    context: str
    location: SourceLocation
    call_site: str
    is_format: bool = False

    @property
    def key(self) -> StringId:
        return StringId.derive(self.source_text, self.context)


@dataclass(slots=True)
class TranslationUnit:
    entry: StringEntry
    target_text: Optional[str] = None
    status: TranslationStatus = TranslationStatus.UNTRANSLATED
    note: str = ""

    def mark_machine(self, text: str) -> None:
        self.target_text = text
        self.status = TranslationStatus.MACHINE

    def mark_reviewed(self, text: str) -> None:
        self.target_text = text
        self.status = TranslationStatus.REVIEWED

    def mark_stale(self) -> None:
        self.status = TranslationStatus.STALE


@dataclass
class TranslationMemory:
    units: list[TranslationUnit] = field(default_factory=list)

    def add(self, unit: TranslationUnit) -> None:
        self.units.append(unit)

    def find_by_source(self, text: str) -> Optional[TranslationUnit]:
        for u in self.units:
            if u.entry.source_text == text:
                return u
        return None

    @property
    def coverage(self) -> float:
        if not self.units:
            return 0.0
        done = sum(
            1 for u in self.units
            if u.status in (TranslationStatus.MACHINE, TranslationStatus.REVIEWED)
            and u.target_text
        )
        return done / len(self.units)
`,
              'warp_zh/config.py': `"""配置加载与默认值。"""
from __future__ import annotations
from dataclasses import dataclass, field
from pathlib import Path
from typing import Optional


@dataclass
class WarpZhConfig:
    locale: str = "zh-CN"
    warp_upstream_sha: str = "f7e1d9da06230a32ae650e6d8aa805424252e2a4"
    glossary_path: Path = Path("data/glossary.zh-CN.yml")
    overrides_path: Path = Path("data/overrides.zh-CN.yml")
    patches_dir: Path = Path("patches")
    call_site_patterns: list[str] = field(default_factory=lambda: [
        "ActionButton::new",
        "CompactibleActionButton::new",
        ".with_tooltip(",
        ".with_title(",
        ".with_label(",
        ".with_placeholder(",
        ".with_header(",
        ".with_description(",
        "tooltip!(",
        "label!(",
        "title!(",
        "menu_item!(",
        "button!(",
    ])
    skip_patterns: list[str] = field(default_factory=lambda: [
        "://",
        "{:?}",
        "RUST_LOG",
        "warp-",
        ".rs",
        "\\\\n",
    ])


def load_config(path: Optional[Path] = None) -> WarpZhConfig:
    cfg = WarpZhConfig()
    if path and path.exists():
        try:
            from ruamel.yaml import YAML
            yaml = YAML()
            data = yaml.load(path)
            if data:
                for k, v in data.items():
                    if hasattr(cfg, k):
                        setattr(cfg, k, v)
        except ImportError:
            pass
    return cfg
`,
