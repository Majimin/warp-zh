[project]
name = "warp-zh"
version = "0.1.0"
description = "Warp 终端简体中文汉化工具链：提取 → 翻译 → 源码改写 → 生成补丁"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["warp", "terminal", "i18n", "localization", "chinese", "zh-CN"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Terminals",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
warp-zh = "warp_zh.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
